name: Release

# 推送 v* 标签时自动构建双平台产物并发布到 GitHub Release
# 也可以在 Actions 页面手动触发（workflow_dispatch）做构建演练
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon；如需 Intel 包再加一个 macos-13 条目
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install pyinstaller pywebview

      # build_app.sh 自带 Python 运行时打包与 PyObjC 安装，无需额外依赖
      - name: Build app bundle (macOS)
        if: runner.os == 'macOS'
        run: ./desktop/build_app.sh

      - name: Build exe (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: desktop\build_app.cmd

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qry "EntraBuddy-${{ github.ref_name }}-macos-arm64.zip" EntraBuddy.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive -Path dist\EntraBuddy.exe
          -DestinationPath "dist\EntraBuddy-${{ github.ref_name }}-windows-x64.zip"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EntraBuddy-*.zip
          generate_release_notes: true
