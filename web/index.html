<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EntraBuddy · 微软账户管家</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <rect x="2.5" y="2.5" width="8.6" height="8.6" rx="1.6" fill="#f25022"/>
          <rect x="12.9" y="2.5" width="8.6" height="8.6" rx="1.6" fill="#7fba00"/>
          <rect x="2.5" y="12.9" width="8.6" height="8.6" rx="1.6" fill="#00a4ef"/>
          <rect x="12.9" y="12.9" width="8.6" height="8.6" rx="1.6" fill="#ffb900"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>EntraBuddy</h1>
        <p>macOS 微软账户管家</p>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="accounts" type="button">账户</button>
      <button class="tab" data-tab="device" type="button">设备</button>
      <button class="tab" data-tab="changes" type="button">变更</button>
    </nav>

    <div class="topbar-actions">
      <span class="scan-time" id="scan-time">正在扫描…</span>
      <button class="btn" id="rescan" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M13.6 2.4v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        重新扫描
      </button>
    </div>
  </header>

  <main class="page">
    <!-- ============ 账户 ============ -->
    <section class="tab-panel active" id="tab-accounts">
      <div class="stats" id="stats"></div>
      <div class="insights" id="insights" hidden></div>

      <div class="workspace">
        <aside class="list-pane">
          <div class="pane-head">
            <h2>账户</h2>
            <span class="count" id="account-count"></span>
          </div>
          <div class="search-wrap">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input id="search" type="search" placeholder="搜索账户、租户…" autocomplete="off" />
          </div>
          <div class="list-tools" id="list-tools"></div>
          <ul class="account-list" id="account-list"></ul>
        </aside>

        <section class="detail-pane" id="detail">
          <div class="empty-state"><p>正在读取账户信息…</p></div>
        </section>
      </div>

      <section class="apps-section">
        <div class="section-head">
          <h2>应用关联</h2>
          <p>每个应用持有哪些微软身份，以及它在其中扮演的角色</p>
        </div>
        <div class="app-grid" id="app-grid"></div>
      </section>
    </section>

    <!-- ============ 设备 ============ -->
    <section class="tab-panel" id="tab-device">
      <div class="two-col">
        <div class="card">
          <div class="card-head"><h2>设备身份</h2></div>
          <div class="kv" id="device-identity"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>注册状态</h2></div>
          <div id="device-enrollment"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>合规自检</h2>
          <div class="score" id="compliance-score"></div>
        </div>
        <div id="compliance-list" class="check-list"></div>
        <p class="card-foot" id="compliance-note"></p>
      </div>
    </section>

    <!-- ============ 变更 ============ -->
    <section class="tab-panel" id="tab-changes">
      <div class="card">
        <div class="card-head">
          <h2>与上次扫描的差异</h2>
          <button class="btn btn-sm" id="save-snapshot" type="button">记录当前快照</button>
        </div>
        <div id="changes-diff"></div>
      </div>

      <div class="two-col">
        <div class="card">
          <div class="card-head"><h2>快照历史</h2><span class="count" id="snapshot-count"></span></div>
          <div id="snapshot-list"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>清理备份</h2><span class="count" id="backup-count"></span></div>
          <div id="backup-list"></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>
        所有数据均在本机读取，不会上传。来源：OneAuth 身份库、Office 许可缓存、
        Microsoft Edge 配置文件、OneDrive 同步客户端、系统 MDM 状态。
      </p>
      <p id="source-line"></p>
    </footer>
  </main>

  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
